<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DynaCalendar · Inbox</title>
<link rel="icon" href="data:," />
</head>
<body class="h-screen flex flex-col bg-surface text-on-surface">
  <header class="bg-surface-container-low sticky top-0 z-20">
    <div class="flex items-center justify-between gap-4 px-6 h-16">
      <div class="flex items-center gap-3 min-w-0">
        <span class="font-medium text-lg tracking-tight text-on-surface">DynaCalendar</span>
        <span class="text-sm text-on-surface-variant">Inbox</span>
      </div>
      <div class="flex items-center gap-2">
        <nav class="hidden md:flex items-center gap-1 bg-surface-container-high rounded-full p-1" aria-label="Pages">
          <button class="px-4 py-1.5 text-sm font-medium rounded-full text-on-surface-variant hover:bg-on-surface/10" onclick="location.href='/'">Calendar</button>
          <button class="px-4 py-1.5 text-sm font-medium rounded-full text-on-surface-variant hover:bg-on-surface/10" onclick="location.href='/week'">Week</button>
          <button aria-current="page" class="px-4 py-1.5 text-sm font-medium rounded-full bg-secondary-container text-on-secondary-container">Inbox</button>
        </nav>
        <button id="btn-tour" class="p-2.5 rounded-full text-on-surface-variant hover:bg-on-surface/10" title="How it works — replay the tour" aria-label="Replay the guided tour">?</button>
        <button id="btn-settings" class="p-2.5 rounded-full text-on-surface-variant hover:bg-on-surface/10" title="Settings" aria-label="Settings">⚙</button>
      </div>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden flex-col md:flex-row">
    <!-- left: chat -->
    <div class="w-full md:w-96 border-b md:border-b-0 md:border-r border-outline-variant bg-surface-container-low flex flex-col shrink-0 max-h-[45vh] md:max-h-none">
      <div class="px-4 py-3 flex items-center gap-2">
        <span class="font-medium text-on-surface">Chat</span>
        <span id="llm-badge" class="text-[10px] font-medium bg-secondary-container text-on-secondary-container px-2.5 py-0.5 rounded-full">(LLM off)</span>
      </div>
      <div id="chat-list" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
      <div class="border-t border-outline-variant p-3 flex gap-2">
        <input
          id="chat-input"
          type="text"
          placeholder="Message…"
          class="flex-1 border border-outline rounded-lg bg-transparent px-3 py-2 text-sm text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary"
        />
        <button
          id="chat-send"
          class="px-4 py-2 rounded-full bg-primary text-on-primary text-sm font-medium hover:shadow-md"
          aria-label="Send message"
        >
          &rarr;
        </button>
      </div>
    </div>

    <!-- right: inbox -->
    <div class="flex-1 flex flex-col min-w-0">
      <div class="px-6 py-3 flex items-center justify-between">
        <div class="flex flex-wrap items-center gap-3">
          <label for="goal-select" class="text-sm text-on-surface-variant">Goal</label>
          <select id="goal-select" class="text-sm border border-outline rounded-lg bg-transparent text-on-surface px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-primary"></select>
          <input
            type="text"
            id="new-goal-title"
            placeholder="New goal title…"
            class="text-sm border border-outline rounded-lg bg-transparent text-on-surface placeholder-on-surface-variant px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-primary w-48 md:w-auto"
          />
          <input
            type="date"
            id="new-goal-deadline"
            aria-label="Goal deadline"
            class="text-sm border border-outline rounded-lg bg-transparent text-on-surface px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-primary"
          />
          <button
            id="btn-new-goal"
            class="px-4 h-9 rounded-full bg-primary text-on-primary text-sm font-medium hover:shadow-md"
          >
            New goal
          </button>
        </div>
      </div>
      <div class="flex-1 overflow-y-auto p-6">
        <div class="mb-5">
          <div
            id="drop-zone"
            class="border-2 border-dashed border-outline-variant rounded-2xl p-10 text-center text-on-surface-variant hover:border-primary hover:bg-primary-container/30 transition"
          >
            <p class="font-medium text-on-surface">Drop files here — just dump everything in</p>
            <p class="text-[11px] text-on-surface-variant">pdf, docx, pptx, images, html…</p>
            <input id="file-input" type="file" multiple class="hidden" />
            <button id="btn-browse" class="mt-2 text-xs font-semibold text-primary underline hover:text-on-primary-container">
              or click to browse
            </button>
          </div>
        </div>
        <div id="attach-banner" class="hidden mb-3 px-4 py-2.5 rounded-xl bg-tertiary-container text-on-tertiary-container text-xs flex items-center gap-3 flex-wrap"></div>
        <div id="file-list" class="space-y-2"></div>
        <div class="mt-7 pt-4">
          <h3 class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">
            Topics
          </h3>
          <div id="topics-strip" class="flex gap-2 flex-wrap"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./src/inbox.js"></script>
</body>
</html>

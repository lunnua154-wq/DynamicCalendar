<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DynaCalendar · Calendar</title>
<link rel="icon" href="data:," />
<!-- FullCalendar v6 injects its own styles from the npm bundle; no CDN link
     here, so the app keeps working with no network access. -->
</head>
<body class="h-screen flex flex-col bg-surface text-on-surface">
  <header class="bg-surface-container-low sticky top-0 z-20">
    <div class="flex items-center justify-between gap-4 px-6 h-16">
      <div class="flex items-center gap-3 min-w-0">
        <span class="font-medium text-lg tracking-tight text-on-surface">DynaCalendar</span>
        <span id="calendar-month" class="text-sm text-on-surface-variant">Nov 2026</span>
      </div>
      <div class="flex items-center gap-2 flex-wrap justify-end">
        <button id="btn-prev-month" class="p-2.5 rounded-full text-on-surface-variant hover:bg-on-surface/10" aria-label="Previous month">‹</button>
        <button id="btn-next-month" class="p-2.5 rounded-full text-on-surface-variant hover:bg-on-surface/10" aria-label="Next month">›</button>
        <button id="btn-today" class="px-4 h-9 rounded-full border border-outline text-sm font-medium text-primary hover:bg-primary/10">
          Today
        </button>
        <nav class="hidden md:flex items-center gap-1 bg-surface-container-high rounded-full p-1" aria-label="Pages">
          <button aria-current="page" class="px-4 py-1.5 text-sm font-medium rounded-full bg-secondary-container text-on-secondary-container">Calendar</button>
          <button
            class="px-4 py-1.5 text-sm font-medium rounded-full text-on-surface-variant hover:bg-on-surface/10"
            onclick="location.href='/week'"
          >
            Week
          </button>
          <button
            class="px-4 py-1.5 text-sm font-medium rounded-full text-on-surface-variant hover:bg-on-surface/10"
            onclick="location.href='/inbox'"
          >
            Inbox
          </button>
        </nav>
        <button
          id="btn-tour"
          class="p-2.5 rounded-full text-on-surface-variant hover:bg-on-surface/10"
          title="How it works — replay the tour"
          aria-label="Replay the guided tour"
        >
          ?
        </button>
        <button
          id="btn-settings"
          class="p-2.5 rounded-full text-on-surface-variant hover:bg-on-surface/10"
          title="Settings"
        >
          ⚙
        </button>
        <button
          id="btn-import"
          class="px-4 h-9 rounded-full bg-primary text-on-primary text-sm font-medium hover:shadow-md"
        >
          Import .ics
        </button>
        <button
          id="btn-replan"
          class="px-4 h-9 rounded-full border border-outline text-sm font-medium text-primary hover:bg-primary/10"
        >
          Re-plan
        </button>
        <input id="file-ics" type="file" accept=".ics" class="hidden" />
      </div>
    </div>
  </header>

  <div id="exam-banner" class="hidden px-6 py-2.5 bg-tertiary-container text-on-tertiary-container text-sm flex items-center gap-3">
    <span id="exam-banner-text"></span>
    <button id="btn-exam-create" class="ml-auto text-xs font-semibold underline">
      Create goal
    </button>
    <button id="btn-exam-dismiss" class="text-xs underline ml-2 opacity-80 hover:opacity-100">
      Dismiss
    </button>
  </div>

  <div id="stats-panel" class="hidden px-6 py-3 bg-surface-container-low">
    <div id="stats-list" class="space-y-2"></div>
  </div>

  <div class="flex flex-1 overflow-hidden">
    <main class="flex-1 p-6 relative min-w-0">
      <div id="calendar" class="h-full"></div>
      <div
        id="empty-state"
        class="hidden absolute inset-0 flex flex-col items-center justify-center text-on-surface-variant text-sm"
      >
        No events yet. Import your calendar (.ics) to start — study jobs will
        appear around it.
      </div>
    </main>

    <aside
      id="day-panel"
      class="hidden w-80 border-l border-outline-variant bg-surface-container-low flex flex-col"
    >
      <div class="flex items-center justify-between px-4 py-3">
        <h2 id="day-panel-date" class="font-medium text-on-surface"></h2>
        <button id="btn-day-close" class="p-2 rounded-full text-on-surface-variant hover:bg-on-surface/10" aria-label="Close day panel">
          ✕
        </button>
      </div>
      <div id="day-panel-list" class="overflow-y-auto flex-1 p-3 space-y-2"></div>
      <div class="px-4 py-3 bg-surface-container-high text-xs text-on-surface-variant">
        Tick a job to mark done &rarr; revisions appear on the Week page.
      </div>
    </aside>
  </div>
  <script type="module" src="./src/calendar.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DynaCalendar · Calendar</title>
<link rel="icon" href="data:," />
<!-- FullCalendar v6 injects its own styles from the npm bundle; no CDN link
     here, so the app keeps working with no network access. -->
</head>
<body class="h-screen flex flex-col bg-slate-50 text-slate-900">
  <header class="border-b border-slate-200 bg-white sticky top-0 z-20">
    <div class="flex items-center justify-between px-6 py-3">
      <div class="flex items-center gap-3">
        <span class="font-bold text-lg tracking-tight">DynaCalendar</span>
        <span id="calendar-month" class="text-sm text-slate-500">Nov 2026</span>
      </div>
      <div class="flex items-center gap-2 flex-wrap justify-end">
        <button id="btn-prev-month" class="px-3 py-1.5 rounded border border-slate-300 text-sm text-slate-700 bg-white hover:bg-slate-50" aria-label="Previous month">‹</button>
        <button id="btn-next-month" class="px-3 py-1.5 rounded border border-slate-300 text-sm text-slate-700 bg-white hover:bg-slate-50" aria-label="Next month">›</button>
        <button id="btn-today" class="px-3 py-1.5 rounded border border-slate-300 text-sm text-slate-700 bg-white hover:bg-slate-50">
          Today
        </button>
        <div class="hidden md:flex gap-1 border border-slate-200 rounded-lg overflow-hidden">
          <button class="px-3 py-1 text-sm bg-blue-600 text-white">Calendar</button>
          <button
            class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-100"
            onclick="location.href='/week'"
          >
            Week
          </button>
          <button
            class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-100"
            onclick="location.href='/inbox'"
          >
            Inbox
          </button>
        </div>
        <button
          id="btn-settings"
          class="p-2 rounded text-slate-500 hover:bg-slate-100"
          title="Settings"
        >
          ⚙
        </button>
        <button
          id="btn-import"
          class="px-3 py-1.5 rounded border border-slate-300 text-sm text-slate-700 bg-white hover:bg-slate-50"
        >
          Import .ics
        </button>
        <button
          id="btn-replan"
          class="px-3 py-1.5 rounded border border-slate-300 text-sm text-slate-700 bg-white hover:bg-slate-50"
        >
          Re-plan
        </button>
        <input id="file-ics" type="file" accept=".ics" class="hidden" />
      </div>
    </div>
  </header>

  <div id="exam-banner" class="hidden px-6 py-2 bg-amber-50 border border-amber-200 text-amber-800 text-sm flex items-center gap-3">
    <span id="exam-banner-text"></span>
    <button id="btn-exam-create" class="ml-auto text-xs underline text-blue-600">
      Create goal
    </button>
    <button id="btn-exam-dismiss" class="text-xs underline ml-2 text-slate-500">
      Dismiss
    </button>
  </div>

  <div id="stats-panel" class="hidden px-6 py-3 border-b border-slate-200 bg-white">
    <div id="stats-list" class="space-y-2"></div>
  </div>

  <div class="flex flex-1 overflow-hidden">
    <main class="flex-1 p-6 relative min-w-0">
      <div id="calendar" class="h-full"></div>
      <div
        id="empty-state"
        class="hidden absolute inset-0 flex flex-col items-center justify-center text-slate-400 text-sm"
      >
        No events yet. Import your calendar (.ics) to start — study jobs will
        appear around it.
      </div>
    </main>

    <aside
      id="day-panel"
      class="hidden w-80 border-l border-slate-200 bg-white flex flex-col shadow-lg"
    >
      <div class="flex items-center justify-between px-4 py-3 border-b border-slate-200">
        <h2 id="day-panel-date" class="font-semibold"></h2>
        <button id="btn-day-close" class="text-slate-400 hover:text-slate-700">
          ✕
        </button>
      </div>
      <div id="day-panel-list" class="overflow-y-auto flex-1 p-3 space-y-2"></div>
      <div class="px-4 py-3 border-t border-slate-200 bg-slate-50 text-xs text-slate-500">
        Tick a job to mark done &rarr; revisions appear on the Week page.
      </div>
    </aside>
  </div>
  <script type="module" src="./src/calendar.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DynaCalendar · Week</title>
<link rel="icon" href="data:," />
<!-- FullCalendar v6 injects its own styles from the npm bundle; no CDN link
     here, so the app keeps working with no network access. -->
</head>
<body class="h-screen flex flex-col bg-surface text-on-surface">
  <header class="bg-surface-container-low sticky top-0 z-20">
    <div class="flex items-center justify-between gap-4 px-6 h-16">
      <div class="flex items-center gap-3 min-w-0">
        <span class="font-medium text-lg tracking-tight text-on-surface">DynaCalendar</span>
        <!-- Populated from FullCalendar's datesSet; deliberately no hardcoded
             week — a static placeholder used to survive API failures and
             contradict the grid. -->
        <span id="week-range" class="text-sm text-on-surface-variant"></span>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-today" class="px-4 h-9 rounded-full border border-outline text-sm font-medium text-primary hover:bg-primary/10">
          Today
        </button>
        <nav class="hidden md:flex items-center gap-1 bg-surface-container-high rounded-full p-1" aria-label="Pages">
          <button class="px-4 py-1.5 text-sm font-medium rounded-full text-on-surface-variant hover:bg-on-surface/10" onclick="location.href='/'">Calendar</button>
          <button aria-current="page" class="px-4 py-1.5 text-sm font-medium rounded-full bg-secondary-container text-on-secondary-container">Week</button>
          <button class="px-4 py-1.5 text-sm font-medium rounded-full text-on-surface-variant hover:bg-on-surface/10" onclick="location.href='/inbox'">Inbox</button>
        </nav>
        <button id="btn-tour" class="p-2.5 rounded-full text-on-surface-variant hover:bg-on-surface/10" title="How it works — replay the tour" aria-label="Replay the guided tour">?</button>
        <button id="btn-settings" class="p-2.5 rounded-full text-on-surface-variant hover:bg-on-surface/10" title="Settings" aria-label="Settings">⚙</button>
        <div id="progress-wrap" class="hidden ml-6 flex items-center gap-2">
          <div class="w-32 h-1.5 bg-surface-container-highest rounded-full overflow-hidden">
            <div id="progress-bar" class="h-full bg-primary rounded-full" style="width:0%"></div>
          </div>
          <span id="progress-text" class="text-xs text-on-surface-variant">0h / 0h</span>
        </div>
      </div>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <main class="flex-1 p-4 relative min-w-0">
      <div id="week-calendar" class="h-full"></div>
      <div
        id="week-empty"
        class="hidden absolute inset-0 flex flex-col items-center justify-center text-on-surface-variant text-sm"
      >
        Nothing planned for this week. Create a goal and drop materials in the
        Inbox.
      </div>
    </main>
  </div>

  <!-- job popover -->
  <div id="job-popover" class="hidden fixed z-50 bg-surface-container-high rounded-2xl border border-outline-variant shadow-xl p-4 w-64"></div>
  <script type="module" src="./src/week.js"></script>
</body>
</html>

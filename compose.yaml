services:
  app:
    build: .
    container_name: dynacalendar
    ports:
      - "8000:8000"
    environment:
      # SQLite + converted markdown live on the mounted volume.
      DYNACALENDAR_DB: /app/data/dynacalendar.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Optional local LLM: `docker compose --profile llm up -d`, then set
  # llm_base_url=http://ollama:11434/v1 and llm_model=<model> in the Settings panel.
  ollama:
    image: ollama/ollama:latest
    container_name: dynacalendar-ollama
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  ollama:
